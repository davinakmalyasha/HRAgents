site_name: HRAgents
site_description: A virtual HR team for the HR department of one — deterministic scoring, human decisions, every outcome reconstructible.
site_url: https://davinakmalyasha.github.io/HRAgents/
repo_url: https://github.com/davinakmalyasha/HRAgents
repo_name: davinakmalyasha/HRAgents
edit_uri: edit/main/docs/
docs_dir: docs
copyright: Apache-2.0 · built in Jakarta

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

