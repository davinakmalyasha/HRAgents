name: Release image

on:
  release:
    types: [published]
  # Release Please creates releases with GITHUB_TOKEN, and GitHub does not run
  # workflows from events that token triggers. Bot-published releases are built
  # by dispatching this workflow with the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. hr-agents-v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  image:
    name: build, scan and attest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Derive the image name and version tags
        id: version
        shell: bash
        run: |
          # GHCR rejects an uppercase path, and the repository is HRAgents.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          version="${TAG#hr-agents-v}"
          if [ "$version" = "$TAG" ]; then version="${TAG#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.5.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan before pushing: an image that fails the gate must never become the
      # published `latest`. The amd64 build is the scan target; the multi-arch
      # push below reuses its cache.
      - name: Build the scan target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: hragents-scan:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hragents-scan:local
          format: sarif
          output: trivy.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Write an SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hragents-scan:local
          format: spdx-json
          output: sbom.spdx.json
          exit-code: "0"

      - name: Record the scan and SBOM on the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" trivy.sarif sbom.spdx.json --clobber

      - name: Keep the reports even when the gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-sarif
          path: |
            trivy.sarif
            sbom.spdx.json
          if-no-files-found: ignore

      # The SARIF above is a full report (every severity) and is attached to
      # the release. This second pass is the gate: Trivy's own severity filter
      # and exit code, so only fixable CRITICALs stop the push.
      - name: Fail on a fixable critical
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hragents-scan:local
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push the multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.minor }}
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=HRAgents
            org.opencontainers.image.description=Deterministic, auditable HR for the department of one
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The SBOM and max-mode provenance are attached to the image digest in
          # the registry, so they travel with the image rather than the release
          # page. An SPDX copy is also attached to the release above.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
