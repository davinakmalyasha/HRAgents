name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. 0.2). Leave empty to deploy 'dev'."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          python-version: "3.14"
      # Post-cut: no pyproject remains, so docs tooling installs straight from
      # pip instead of `uv sync --group docs`. This is build tooling only; no
      # Python source ships in the repo.
      - run: pip install mkdocs-material mkdocs-swagger-ui-tag pymdown-extensions mike

      - name: Configure git for the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Main deploys "dev"; a release is deployed by running this workflow with
      # its version, which also moves the stable alias. Old versions stay
      # addressable at /HRAgents/<version>/.
      - name: Deploy main as dev
        if: inputs.version == ''
        run: mike deploy --push dev

      - name: Deploy a release and move latest
        if: inputs.version != ''
        run: |
          mike deploy --push --update-aliases "${{ inputs.version }}" latest
          mike set-default --push latest
