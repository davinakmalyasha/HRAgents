name: Ingestion benchmark

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: benchmark (in-process ASGI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked
      # A clean clone reproduces the number; the artifact keeps it comparable
      # week to week. Runner hardware still varies, so treat it as a trend, not
      # an absolute capacity claim.
      - run: >-
          uv run python scripts/benchmark_ingestion.py
          --total 1000 --concurrency 32 --json > benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingestion-benchmark
          path: benchmark.json
          if-no-files-found: error
          retention-days: 30
