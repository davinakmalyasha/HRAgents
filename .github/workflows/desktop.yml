name: desktop

on:
  pull_request:
    paths:
      - "rust/**"
      - "parity/**"
      - "scripts/parity_export.py"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "parity/**"
      - "scripts/parity_export.py"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Rust core, store, IPC, shell
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --exclude hragents-desktop --all-targets -- -D warnings
      - name: Provider replay (recorded, no network)
        run: cargo test -p hragents-agents --test provider_replay
      - name: Tests and parity fixtures
        run: cargo test --workspace --exclude hragents-desktop
      - name: Tauri shell compiles
        run: cargo build -p hragents-desktop

  sqlcipher:
    name: SQLCipher build and reopen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: sudo apt-get update && sudo apt-get install -y build-essential perl
      - run: cargo test -p hragents-store --features sqlcipher
      - run: cargo test -p hragents-ipc --features sqlcipher

  ui:
    name: Desktop UI typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: rust/apps/desktop/ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  parity:
    name: Python oracle fixtures regenerate cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Export fixtures from the Python implementation
        run: uv run python scripts/parity_export.py parity/fixtures
      - name: Fixtures are committed and current
        run: git diff --exit-code -- parity/fixtures
