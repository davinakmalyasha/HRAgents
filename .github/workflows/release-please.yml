name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR bumps pyproject.toml, which makes `uv.lock` and the
      # committed OpenAPI document stale -- and CI refuses both. Update them on
      # the PR branch as part of the same run, so re-running the checks on a
      # release PR is enough to merge it.
      - if: steps.release.outputs.pr != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - if: steps.release.outputs.pr != ''
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - if: steps.release.outputs.pr != ''
        run: uv python install 3.14
      - if: steps.release.outputs.pr != ''
        run: uv lock
      - if: steps.release.outputs.pr != ''
        run: uv run python scripts/export_openapi.py
      - if: steps.release.outputs.pr != ''
        shell: bash
        run: |
          if git diff --quiet uv.lock docs/api/openapi.json; then
            echo "generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock docs/api/openapi.json
          git commit -m "chore: refresh generated files for the release"
          git push
