name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hragents
          POSTGRES_PASSWORD: hragents
          POSTGRES_DB: hragents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hragents -d hragents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HRAGENTS_DATABASE_URL: postgresql+asyncpg://hragents:hragents@localhost:5432/hragents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-groups
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check for model/migration drift
        run: uv run alembic check
      - name: Round-trip downgrade and upgrade
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  postgres-adapters:
    name: postgres-adapters
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hragents
          POSTGRES_PASSWORD: hragents
          POSTGRES_DB: hragents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hragents -d hragents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HRAGENTS_TEST_DB_URL: postgresql+psycopg://app_test:app_test@localhost:5432/hragents
      HRAGENTS_TEST_DB_ADMIN_URL: postgresql://hragents:hragents@localhost:5432/hragents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-groups
      - name: Prepare non-superuser test role (RLS applies under FORCE)
        run: uv run python scripts/prepare_test_db.py
      - run: uv run pytest tests/db -q

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.14
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose
