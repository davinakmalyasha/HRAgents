name: Feature request
description: Propose a capability or change
title: "feat: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check `docs/plan/master-build-plan.md` first — the roadmap may already cover it.
        Hard rules that are never violated: agents never decide; no auto-rejection;
        no payment execution; no shell tools. Requests that break these are declined.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: rules
    attributes:
      label: Hard rules
      options:
        - label: This keeps every consequential decision with a named human.
          required: true
