<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HRAgents</title>
  </head>
  <body>
    <!-- Static shell: WebView2 paints this before the 300 kB bundle parses,
      so a cold start shows the brand immediately instead of a blank window.
      React replaces it on first render. Colours mirror theme.css :root. -->
    <div id="root">
      <div
        style="min-height:100vh;display:grid;place-items:center;background:#f6f4ef;color:#1c1a17;font-family:system-ui,'Segoe UI',sans-serif"
      >
        <div style="display:flex;align-items:center;gap:12px">
          <span
            style="display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#1c1a17;color:#f6f4ef;font-weight:700;font-size:14px;letter-spacing:0.02em"
            >HR</span
          >
          <span style="font-size:14px;color:#5f5a52">Opening HRAgents…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
