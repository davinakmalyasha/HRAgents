[package]
name = "hragents-store"
description = "SQLite persistence for HRAgents Desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hragents-core = { path = "../hragents-core" }
rusqlite.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
argon2.workspace = true

[features]
# Release builds enable SQLCipher. Default stays plain SQLite so the core test
# suite does not require an OpenSSL build; the release gate must run with it on.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dev-dependencies]
tempfile.workspace = true
