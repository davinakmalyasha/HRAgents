[extend]
useDefault = true

[[allowlists]]
description = "Placeholder credentials used in tests, docs, and examples"
regexTarget = "match"
regexes = [
  '''sk-ant-1234''',
  '''sk-ant-secret-abcd''',
  '''sk-ant-test''',
  '''sk-ant-\.\.\.''',
  '''cmd-\.\.\.''',
]

[[allowlists]]
description = "sqlcipher unit-test dummy key (test vector, not a credential)"
regexTarget = "line"
regexes = ['''0123456789abcdef"\.repeat\(4\)''']
